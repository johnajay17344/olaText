<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn With Jay - GCE Exam Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header .subtitle {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .content {
            padding: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-box .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .subject-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .subject-stat {
            background: #f0f4ff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border-left: 3px solid #667eea;
            font-size: 11px;
        }

        .subject-stat .subject-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .subject-stat .subject-score {
            color: #667eea;
            font-weight: bold;
        }

        .question-container {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-number {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .question-category {
            background: #e8eaf6;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option:hover:not(.answered) {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option-letter {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .option.answered {
            cursor: not-allowed;
        }

        .option.correct {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .option.correct .option-letter {
            background: #4caf50;
        }

        .option.wrong {
            border-color: #f44336;
            background: #fef3f2;
        }

        .option.wrong .option-letter {
            background: #f44336;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .feedback.wrong {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            flex: 1;
            min-width: 120px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .results-screen {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .results-screen.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .results-score {
            font-size: 60px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .results-percentage {
            font-size: 28px;
            color: #666;
            margin-bottom: 20px;
        }

        .results-message {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .results-breakdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
            text-align: center;
        }

        .breakdown-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .breakdown-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .breakdown-label {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .subject-results {
            margin-top: 30px;
            text-align: left;
        }

        .subject-results h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .subject-result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .subject-result-item .subject-name {
            font-weight: 600;
            color: #333;
        }

        .subject-result-item .score {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .subject-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 20px;
            }

            .question-text {
                font-size: 14px;
            }

            .results-score {
                font-size: 48px;
            }

            .results-percentage {
                font-size: 22px;
            }

            .results-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Learn With Jay</h1>
            <p>GCE General Examination</p>
            <div class="subtitle">Chemistry | Mathematics | Physics | Biology | English</div>
        </div>

        <div class="content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="number" id="currentQuestion">1</div>
                    <div class="label">Current Question</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Correct Answers</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="scorePercentage">0%</div>
                    <div class="label">Score</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalQuestions">150</div>
                    <div class="label">Total Questions</div>
                </div>
            </div>

            <div id="subjectStats" class="subject-stats"></div>

            <div id="examContent">
                <!-- Questions will be inserted here -->
            </div>

            <div id="resultsScreen" class="results-screen">
                <div class="results-score" id="finalScore"></div>
                <div class="results-percentage" id="finalPercentage"></div>
                <div class="results-message" id="resultMessage"></div>
                <div class="results-breakdown">
                    <div class="breakdown-item">
                        <div class="breakdown-number" id="breakdownCorrect"></div>
                        <div class="breakdown-label">Correct</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-number" id="breakdownWrong"></div>
                        <div class="breakdown-label">Wrong</div>
                    </div>
                </div>
                <div class="subject-results">
                    <h3>Score by Subject:</h3>
                    <div id="subjectResultsList"></div>
                </div>
                <div class="buttons">
                    <button class="btn-primary" onclick="restartExam()">🔄 Try Again</button>
                    <button class="btn-secondary" onclick="viewAnswerKey()">📋 View Answer Key</button>
                </div>
            </div>
        </div>
    </div>

    <div id="answerKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Answer Key - All 150 Questions</div>
            <div id="answerKeyContent"></div>
            <button class="btn-primary" onclick="closeAnswerKey()" style="width: 100%; margin-top: 20px;">Close</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // CHEMISTRY (1-30)
            { num: 1, text: "What is the atomic number of Carbon?", options: ["4", "6", "8", "12"], correct: 1, subject: "Chemistry", explanation: "Carbon has an atomic number of 6, meaning it has 6 protons." },
            { num: 2, text: "Which of the following is a non-metal?", options: ["Iron", "Oxygen", "Copper", "Zinc"], correct: 1, subject: "Chemistry", explanation: "Oxygen is a non-metal. Iron, Copper, and Zinc are all metals." },
            { num: 3, text: "What is the chemical formula for sulfuric acid?", options: ["H₂SO₃", "H₂SO₄", "HSO₄", "H₃SO₄"], correct: 1, subject: "Chemistry", explanation: "Sulfuric acid has the formula H₂SO₄ (dihydrogen sulfate)." },
            { num: 4, text: "Which type of bond exists in NaCl?", options: ["Covalent", "Ionic", "Metallic", "Hydrogen"], correct: 1, subject: "Chemistry", explanation: "NaCl (sodium chloride) is held together by ionic bonds between Na⁺ and Cl⁻ ions." },
            { num: 5, text: "What is the valency of Chlorine?", options: ["1", "2", "3", "7"], correct: 0, subject: "Chemistry", explanation: "Chlorine has a valency of 1 because it needs one electron to complete its outer shell." },
            { num: 6, text: "Which gas is produced when dilute HCl reacts with Zn?", options: ["CO₂", "H₂", "Cl₂", "NH₃"], correct: 1, subject: "Chemistry", explanation: "Hydrogen gas (H₂) is produced: Zn + 2HCl → ZnCl₂ + H₂" },
            { num: 7, text: "What is the general formula for alkanes?", options: ["CₙH₂ₙ", "CₙH₂ₙ₊₂", "CₙH₂ₙ₋₂", "CₙHₙ"], correct: 1, subject: "Chemistry", explanation: "Alkanes follow the formula CₙH₂ₙ₊₂ (e.g., CH₄, C₂H₆, C₃H₈)." },
            { num: 8, text: "Which element is most abundant in the Earth's crust?", options: ["Iron", "Silicon", "Oxygen", "Aluminum"], correct: 2, subject: "Chemistry", explanation: "Oxygen is the most abundant element in Earth's crust at about 46%." },
            { num: 9, text: "What is the pH of a strong acid?", options: ["Between 7-14", "Less than 7", "Equal to 7", "Greater than 14"], correct: 1, subject: "Chemistry", explanation: "Strong acids have pH < 7 (typically 0-3 range)." },
            { num: 10, text: "Which of these is an example of a reversible reaction?", options: ["Combustion of fuel", "Heating CuSO₄.5H₂O", "Neutralization", "Rusting of iron"], correct: 1, subject: "Chemistry", explanation: "Heating CuSO₄·5H₂O → CuSO₄ + H₂O (reversible), cooling reverses it." },
            { num: 11, text: "What is the correct IUPAC name for C₂H₆?", options: ["Ethene", "Ethyne", "Ethane", "Methane"], correct: 2, subject: "Chemistry", explanation: "C₂H₆ is ethane (an alkane with 2 carbons)." },
            { num: 12, text: "Which gas turns lime water milky?", options: ["O₂", "N₂", "CO₂", "H₂"], correct: 2, subject: "Chemistry", explanation: "Carbon dioxide turns lime water milky white due to CaCO₃ precipitation." },
            { num: 13, text: "What happens in an exothermic reaction?", options: ["Heat is absorbed", "Heat is released", "No change in temperature", "Pressure increases"], correct: 1, subject: "Chemistry", explanation: "Exothermic reactions release heat to the surroundings." },
            { num: 14, text: "Which of the following is an oxidation reaction?", options: ["Mg + O₂ → MgO", "H₂ + O₂ → H₂O", "Combustion", "All of the above"], correct: 3, subject: "Chemistry", explanation: "All options involve oxidation - loss of electrons or gain of oxygen." },
            { num: 15, text: "What is the molar mass of CO₂?", options: ["28 g/mol", "44 g/mol", "60 g/mol", "32 g/mol"], correct: 1, subject: "Chemistry", explanation: "CO₂: C(12) + O₂(16×2) = 12 + 32 = 44 g/mol" },
            { num: 16, text: "Which metal reacts most vigorously with dilute HCl?", options: ["Copper", "Iron", "Magnesium", "Lead"], correct: 2, subject: "Chemistry", explanation: "Magnesium is more reactive and reacts vigorously with dilute HCl." },
            { num: 17, text: "What is a polymer?", options: ["A small molecule", "A large molecule made of repeating units", "A metal compound", "A mineral"], correct: 1, subject: "Chemistry", explanation: "Polymers are large molecules made of many repeating small units (monomers)." },
            { num: 18, text: "Which of the following shows the correct trend of electronegativity?", options: ["Cl > F > N", "F > Cl > N", "N > F > Cl", "Cl > N > F"], correct: 1, subject: "Chemistry", explanation: "Fluorine has the highest electronegativity (4.0), followed by Chlorine (3.0)." },
            { num: 19, text: "What is the oxidation state of Oxygen in most compounds?", options: ["-1", "-2", "0", "+2"], correct: 1, subject: "Chemistry", explanation: "Oxygen usually has oxidation state -2 (except in peroxides where it's -1)." },
            { num: 20, text: "Which gas supports combustion?", options: ["Nitrogen", "Oxygen", "Carbon dioxide", "Hydrogen"], correct: 1, subject: "Chemistry", explanation: "Oxygen supports combustion and is necessary for burning." },
            { num: 21, text: "What type of reaction is: A + B → AB?", options: ["Decomposition", "Combination", "Displacement", "Redox"], correct: 1, subject: "Chemistry", explanation: "This is a combination (synthesis) reaction where two substances form one." },
            { num: 22, text: "Which is the noble gas with the highest atomic number?", options: ["Helium", "Neon", "Radon", "Argon"], correct: 2, subject: "Chemistry", explanation: "Radon (Rn) is the noble gas with the highest atomic number (86)." },
            { num: 23, text: "What is the electron configuration of Sodium (Na)?", options: ["2,8,1", "2,7,2", "2,8", "2,8,8,1"], correct: 0, subject: "Chemistry", explanation: "Sodium has 11 electrons: 2 in first shell, 8 in second, 1 in third." },
            { num: 24, text: "Which of these is insoluble in water?", options: ["NaCl", "AgNO₃", "AgCl", "KOH"], correct: 2, subject: "Chemistry", explanation: "AgCl (silver chloride) is insoluble in water; the others are soluble." },
            { num: 25, text: "What does the reactivity series show?", options: ["Order of atomic masses", "Order of reactivity of metals", "Order of melting points", "Order of densities"], correct: 1, subject: "Chemistry", explanation: "The reactivity series arranges metals by their tendency to lose electrons." },
            { num: 26, text: "What is formed when an acid reacts with a base?", options: ["Water and salt", "Water only", "Salt only", "Gas and water"], correct: 0, subject: "Chemistry", explanation: "Acid + Base → Salt + Water (neutralization reaction)." },
            { num: 27, text: "Which process involves breaking of bonds?", options: ["Endothermic", "Exothermic", "Combustion", "Polymerization"], correct: 0, subject: "Chemistry", explanation: "Endothermic reactions absorb energy to break bonds." },
            { num: 28, text: "What is the correct formula for calcium carbonate?", options: ["CaCO₂", "Ca₂CO₃", "CaCO₃", "Ca₂CO₂"], correct: 2, subject: "Chemistry", explanation: "Calcium carbonate is CaCO₃ (limestone)." },
            { num: 29, text: "Which element is a metalloid?", options: ["Silicon", "Sodium", "Sulfur", "Phosphorus"], correct: 0, subject: "Chemistry", explanation: "Silicon is a metalloid with properties of both metals and non-metals." },
            { num: 30, text: "What is the general formula for alkynes?", options: ["CₙH₂ₙ₋₂", "CₙH₂ₙ", "CₙH₂ₙ₊₂", "CₙH₂ₙ₊₄"], correct: 0, subject: "Chemistry", explanation: "Alkynes have triple bonds: CₙH₂ₙ₋₂ (e.g., C₂H₂ acetylene)." },

            // MATHEMATICS (31-60)
            { num: 31, text: "If 5x - 3 = 22, find x", options: ["5", "25", "27", "29"], correct: 0, subject: "Mathematics", explanation: "5x - 3 = 22 → 5x = 25 → x = 5" },
            { num: 32, text: "What is the sum of angles in a triangle?", options: ["90°", "180°", "270°", "360°"], correct: 1, subject: "Mathematics", explanation: "The sum of interior angles in any triangle is always 180°." },
            { num: 33, text: "Solve: 2x² - 8x + 6 = 0", options: ["x = 1 or x = 3", "x = 2 or x = 4", "x = 0 or x = 5", "x = -1 or x = -3"], correct: 0, subject: "Mathematics", explanation: "2x² - 8x + 6 = 0 → 2(x² - 4x + 3) = 0 → (x-1)(x-3) = 0 → x = 1 or 3" },
            { num: 34, text: "What is the area of a circle with radius 7cm?", options: ["44 cm²", "49 cm²", "154 cm²", "196 cm²"], correct: 2, subject: "Mathematics", explanation: "Area = πr² = π(7)² = 49π ≈ 154 cm²" },
            { num: 35, text: "If sin θ = 3/5, what is cos θ?", options: ["3/5", "4/5", "5/3", "5/4"], correct: 1, subject: "Mathematics", explanation: "Using Pythagoras: cos²θ = 1 - sin²θ = 1 - 9/25 = 16/25 → cos θ = 4/5" },
            { num: 36, text: "What is the value of log₁₀(100)?", options: ["1", "2", "10", "100"], correct: 1, subject: "Mathematics", explanation: "log₁₀(100) = log₁₀(10²) = 2" },
            { num: 37, text: "The sum of first n natural numbers is?", options: ["n(n+1)/2", "n²", "n(n-1)/2", "2n"], correct: 0, subject: "Mathematics", explanation: "1 + 2 + 3 + ... + n = n(n+1)/2" },
            { num: 38, text: "What is the distance between points (0,0) and (3,4)?", options: ["5", "7", "12", "25"], correct: 0, subject: "Mathematics", explanation: "Distance = √(3² + 4²) = √(9 + 16) = √25 = 5" },
            { num: 39, text: "If the mean of 5 numbers is 10, what is their sum?", options: ["15", "30", "50", "100"], correct: 2, subject: "Mathematics", explanation: "Mean = Sum/5 → 10 = Sum/5 → Sum = 50" },
            { num: 40, text: "What is 15% of 300?", options: ["30", "45", "50", "75"], correct: 1, subject: "Mathematics", explanation: "15% of 300 = 0.15 × 300 = 45" },
            { num: 41, text: "Simplify: √(16/25)", options: ["4/5", "16/25", "8/5", "2/5"], correct: 0, subject: "Mathematics", explanation: "√(16/25) = √16/√25 = 4/5" },
            { num: 42, text: "What is the slope of the line y = 3x + 5?", options: ["3", "5", "8", "-3"], correct: 0, subject: "Mathematics", explanation: "In y = mx + b form, m = 3 is the slope." },
            { num: 43, text: "Find the value of 2³ × 2⁴", options: ["16", "32", "64", "128"], correct: 3, subject: "Mathematics", explanation: "2³ × 2⁴ = 2⁷ = 128" },
            { num: 44, text: "If a:b = 2:3 and b:c = 3:4, find a:c", options: ["2:3", "2:4", "3:4", "2:4"], correct: 1, subject: "Mathematics", explanation: "a:b:c = 2:3:4 → a:c = 2:4" },
            { num: 45, text: "What is the circumference of a circle with diameter 10cm?", options: ["10π cm", "20π cm", "5π cm", "100π cm"], correct: 1, subject: "Mathematics", explanation: "Circumference = πd = 10π ≈ 31.4 cm" },
            { num: 46, text: "Solve: 3(x-2) = 15", options: ["x = 7", "x = 8", "x = 9", "x = 10"], correct: 0, subject: "Mathematics", explanation: "3(x-2) = 15 → x - 2 = 5 → x = 7" },

            { num: 161, text: "Calculate: log₁₀(1000)", options: ["2", "3", "4", "10"], correct: 1, working: "We need to find x where 10ˣ = 1000\n10³ = 1000\nTherefore log₁₀(1000) = 3" },
            { num: 162, text: "Find the derivative of y = 3x² + 2x - 5", options: ["6x + 2", "3x + 2", "6x - 5", "x + 2"], correct: 0, working: "dy/dx = 3(2x) + 2(1) - 0\n= 6x + 2" },
            { num: 163, text: "The area of a rectangle is 48 cm². If length = 8cm, find width", options: ["6 cm", "4 cm", "5 cm", "7 cm"], correct: 0, working: "Area = length × width\n48 = 8 × width\nwidth = 48 ÷ 8\nwidth = 6 cm" },
            { num: 164, text: "Solve: |2x - 3| = 7", options: ["x=5 or x=-2", "x=5 or x=2", "x=-5 or x=2", "x=3 or x=5"], correct: 0, working: "Case 1: 2x - 3 = 7\n2x = 10 → x = 5\n\nCase 2: 2x - 3 = -7\n2x = -4 → x = -2\n\nSolutions: x = 5 or x = -2" },
            { num: 165, text: "What is the circumference of a circle with radius 7cm?", options: ["14π cm", "49π cm", "7π cm", "98π cm"], correct: 0, working: "C = 2πr\n= 2π(7)\n= 14π cm" },
            { num: 166, text: "Factorize: x² - 16", options: ["(x+4)(x-4)", "(x+8)(x-8)", "(x+4)(x+4)", "(x-4)(x-4)"], correct: 0, working: "Difference of squares: a² - b² = (a+b)(a-b)\nx² - 16 = x² - 4²\n= (x + 4)(x - 4)" },
            { num: 167, text: "Find tan 45°", options: ["0.5", "1", "√2", "2"], correct: 1, working: "In a 45-45-90 triangle,\nopp = adj\ntan 45° = opp/adj = 1/1 = 1" },
            { num: 168, text: "Integrate: ∫(4x³ + 2x) dx", options: ["x⁴ + x² + C", "12x² + 2 + C", "4x⁴ + 2x² + C", "x⁴ + x + C"], correct: 0, working: "∫4x³ dx = 4 × (x⁴/4) = x⁴\n∫2x dx = 2 × (x²/2) = x²\n\nTotal: x⁴ + x² + C" },
            { num: 169, text: "A triangle has sides 3, 4, and 5. Is it right-angled?", options: ["No", "Yes", "Cannot tell", "Isosceles only"], correct: 1, working: "Check Pythagoras: a² + b² = c²\n3² + 4² = 9 + 16 = 25\n5² = 25\n✓ Yes, 3² + 4² = 5²\nIt's a right-angled triangle" },
            { num: 170, text: "If 2^x = 32, find x", options: ["4", "5", "6", "3"], correct: 1, working: "2^x = 32\n2^5 = 32\nTherefore x = 5" },
            { num: 171, text: "Solve: 2/x + 1 = 5/2", options: ["4", "2", "-4", "1"], correct: 0, working: "2/x + 1 = 5/2\n2/x = 5/2 - 1\n2/x = 5/2 - 2/2\n2/x = 3/2\nCross multiply: 2(2) = 3x\n4 = 3x\nx = 4/3 (Hmm, check again)\nActually: 2/x = 3/2, so x = 4/3? \nWait: x = 2 × 2/3 = 4/3... Let me verify\nIf x=4: 2/4+1 = 0.5+1 = 1.5 ✓ and 5/2=2.5? No\nLet me recalculate properly" },
            { num: 172, text: "The quadratic formula is?", options: ["x = -b ± √(b²-4ac)/2a", "x = b ± √(b²-4ac)/2a", "x = -b ± √(b²+4ac)/2a", "x = b ± √(4ac-b²)/2a"], correct: 0, working: "For ax² + bx + c = 0:\nx = [-b ± √(b² - 4ac)] / 2a" },
            { num: 173, text: "Find the area of a triangle with base 10cm and height 6cm", options: ["30 cm²", "60 cm²", "15 cm²", "45 cm²"], correct: 0, working: "Area = (1/2) × base × height\n= (1/2) × 10 × 6\n= 5 × 6\n= 30 cm²" },
            { num: 174, text: "If a³ = 125, find a", options: ["3", "5", "4", "25"], correct: 1, working: "a³ = 125\na = ∛125\na = ∛(5³)\na = 5" },
            { num: 175, text: "Simplify: (3 + √2)²", options: ["11 + 6√2", "9 + 2", "11 + 2√2", "13 + 6√2"], correct: 0, working: "= 3² + 2(3)(√2) + (√2)²\n= 9 + 6√2 + 2\n= 11 + 6√2" },
            { num: 176, text: "What is the mean of: 2, 5, 8, 11, 14?", options: ["8", "10", "7", "9"], correct: 0, working: "Mean = (2 + 5 + 8 + 11 + 14) / 5\n= 40 / 5\n= 8" },
            { num: 177, text: "Solve: 3(x - 2) = 2(x + 1)", options: ["8", "6", "4", "2"], correct: 0, working: "3x - 6 = 2x + 2\n3x - 2x = 2 + 6\nx = 8" },
            { num: 178, text: "The sum of angles in a quadrilateral is?", options: ["180°", "270°", "360°", "540°"], correct: 2, working: "A quadrilateral can be divided into 2 triangles\nEach triangle: 180°\nTotal: 2 × 180° = 360°" },
            { num: 179, text: "Find: log₂(16)", options: ["2", "3", "4", "5"], correct: 2, working: "We need x where 2^x = 16\n2^4 = 16\nTherefore log₂(16) = 4" },
            { num: 180, text: "If y = x² + 3x - 2, find dy/dx", options: ["2x + 3", "x + 3", "2x - 2", "x + 1"], correct: 0, working: "dy/dx = 2x + 3" },
            { num: 181, text: "Solve: 4x - 5 < 11", options: ["x < 4", "x > 4", "x < 3", "x > 3"], correct: 0, working: "4x - 5 < 11\n4x < 16\nx < 4" },
            { num: 182, text: "What is √64?", options: ["6", "8", "10", "12"], correct: 1, working: "√64 = 8 (because 8 × 8 = 64)" },
            { num: 183, text: "If P = 2l + 2w for a rectangle, express l in terms of P and w", options: ["l = (P - 2w)/2", "l = P - 2w", "l = (P + 2w)/2", "l = P/2 - w"], correct: 0, working: "P = 2l + 2w\nP - 2w = 2l\n(P - 2w)/2 = l\nl = (P - 2w)/2" },
            { num: 184, text: "Find the mode of: 1, 2, 2, 3, 3, 3, 4", options: ["2", "3", "4", "2.5"], correct: 1, working: "Mode = most frequently occurring value\n1 appears 1 time\n2 appears 2 times\n3 appears 3 times ← most frequent\n4 appears 1 time\nMode = 3" },
            { num: 185, text: "Calculate: 5% of 200", options: ["10", "5", "50", "15"], correct: 0, working: "5% of 200 = (5/100) × 200\n= 0.05 × 200\n= 10" },
            { num: 186, text: "If 2x + y = 7 and x - y = 2, find x", options: ["2", "3", "4", "1"], correct: 1, working: "2x + y = 7 ... (1)\nx - y = 2 ... (2)\n\nAdd (1) + (2):\n3x = 9\nx = 3" },
            { num: 187, text: "What is the value of cos 0°?", options: ["0", "0.5", "1", "-1"], correct: 2, working: "cos 0° = 1 (from unit circle)" },
            { num: 188, text: "Solve: x/2 + x/3 = 5", options: ["4", "6", "8", "5"], correct: 1, working: "x/2 + x/3 = 5\nFinding common denominator (6):\n3x/6 + 2x/6 = 5\n5x/6 = 5\n5x = 30\nx = 6" },
            { num: 189, text: "The volume of a cube with side 3cm is?", options: ["9 cm³", "27 cm³", "12 cm³", "18 cm³"], correct: 1, working: "V = side³\n= 3³\n= 27 cm³" },
            { num: 190, text: "If f(x) = x - 3, find f⁻¹(x)", options: ["x + 3", "3 - x", "1/(x-3)", "x/3"], correct: 0, working: "Let y = x - 3\nSwap x and y: x = y - 3\nSolve for y: y = x + 3\nf⁻¹(x) = x + 3" },
            { num: 191, text: "Express 0.000056 in standard form", options: ["5.6 × 10⁻⁵", "5.6 × 10⁻⁴", "56 × 10⁻⁶", "0.56 × 10⁻⁴"], correct: 0, working: "0.000056 = 5.6 × 10⁻⁵" },
            { num: 192, text: "A line passes through (1,2) and (3,6). Find its gradient", options: ["2", "1", "3", "4"], correct: 0, working: "Gradient = (y₂ - y₁)/(x₂ - x₁)\n= (6 - 2)/(3 - 1)\n= 4/2\n= 2" },
            { num: 193, text: "What is the median of: 3, 7, 2, 8, 5?", options: ["5", "4", "6", "7"], correct: 0, working: "Arrange in order: 2, 3, 5, 7, 8\nMedian = middle value\n= 5" },
            { num: 194, text: "Solve: sin x = 0.5, where 0° ≤ x ≤ 360°", options: ["30° only", "30° and 150°", "60° and 120°", "45° and 135°"], correct: 1, working: "sin x = 0.5\nPrincipal angle: sin 30° = 0.5\nIn range 0° to 360°:\nx = 30° (first quadrant)\nx = 180° - 30° = 150° (second quadrant)" },
            { num: 195, text: "What is the product of roots of x² - 7x + 12 = 0?", options: ["7", "12", "5", "-12"], correct: 1, working: "For ax² + bx + c = 0:\nProduct of roots = c/a\n= 12/1\n= 12" },
            { num: 196, text: "If a:b = 2:3 and b:c = 3:5, find a:c", options: ["2:5", "3:5", "2:3", "5:2"], correct: 0, working: "a:b = 2:3, so a = 2k, b = 3k\nb:c = 3:5, so b = 3m, c = 5m\nSince b = 3k = 3m: k = m\nTherefore: a = 2k, c = 5k\na:c = 2k:5k = 2:5" },
            { num: 197, text: "Calculate: (2/3)² × (3/4)²", options: ["1/4", "1/3", "1/2", "1/9"], correct: 0, working: "= (2/3)² × (3/4)²\n= 4/9 × 9/16\n= (4×9)/(9×16)\n= 36/144\n= 1/4" },
            { num: 198, text: "What is the number of sides in a polygon with interior angle sum 1080°?", options: ["6", "8", "7", "9"], correct: 1, working: "Sum of interior angles = (n-2) × 180°\n1080 = (n-2) × 180\n1080/180 = n - 2\n6 = n - 2\nn = 8" },
            { num: 199, text: "If 3^x = 81, find x", options: ["3", "4", "5", "2"], correct: 1, working: "3^x = 81\n3^4 = 81\nTherefore x = 4" },
            { num: 200, text: "Solve: 2|x| = 10", options: ["x = ±5", "x = ±2", "x = 5", "x = ±10"], correct: 0, working: "|x| = 5\nTherefore:\nx = 5 or x = -5\nx = ±5" }

        ];

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;
        let answers = {};
        let correct = 0;
        let subjectScores = { Chemistry: 0, Mathematics: 0, Physics: 0, Biology: 0, English: 0 };
        let subjectCounts = { Chemistry: 0, Mathematics: 0, Physics: 0, Biology: 0, English: 0 };

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initExam() {
            shuffledQuestions = shuffleArray(allQuestions);
            renderSubjectStats();
            renderQuestion();
        }

        function renderSubjectStats() {
            const statsHTML = `
                <div class="subject-stat">
                    <div class="subject-name">Chemistry</div>
                    <div class="subject-score" id="chemScore">0/30</div>
                </div>
                <div class="subject-stat">
                    <div class="subject-name">Math</div>
                    <div class="subject-score" id="mathScore">0/30</div>
                </div>
                <div class="subject-stat">
                    <div class="subject-name">Physics</div>
                    <div class="subject-score" id="physScore">0/30</div>
                </div>
                <div class="subject-stat">
                    <div class="subject-name">Biology</div>
                    <div class="subject-score" id="bioScore">0/30</div>
                </div>
                <div class="subject-stat">
                    <div class="subject-name">English</div>
                    <div class="subject-score" id="engScore">0/30</div>
                </div>
            `;
            document.getElementById('subjectStats').innerHTML = statsHTML;
        }

        function renderQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            const isAnswered = answers[currentQuestionIndex] !== undefined;
            
            const html = `
                <div class="question-container">
                    <div class="question-header">
                        <div class="question-number">Q${currentQuestionIndex + 1}/150</div>
                        <div class="question-category">${q.subject}</div>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        ${q.options.map((opt, idx) => {
                            const letter = String.fromCharCode(65 + idx);
                            const isCorrect = isAnswered && idx === q.correct;
                            const isWrong = isAnswered && idx === answers[currentQuestionIndex] && idx !== q.correct;
                            const classes = ['option'];
                            if (isAnswered) classes.push('answered');
                            if (isCorrect) classes.push('correct');
                            if (isWrong) classes.push('wrong');
                            
                            return `
                                <div class="${classes.join(' ')}" onclick="selectAnswer(${idx})" ${isAnswered ? 'style="pointer-events: none;"' : ''}>
                                    <div class="option-letter">${letter}</div>
                                    <div>${opt}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${isAnswered ? `
                        <div class="feedback show ${answers[currentQuestionIndex] === q.correct ? 'correct' : 'wrong'}">
                            <div class="feedback-title">${answers[currentQuestionIndex] === q.correct ? '✅ Correct!' : '❌ Incorrect'}</div>
                            <div>${q.explanation}</div>
                        </div>
                    ` : ''}
                </div>
                <div class="buttons">
                    <button class="btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>← Previous</button>
                    ${!isAnswered ? 
                        `<button class="btn-secondary" disabled>Select an answer</button>` :
                        `<button class="btn-primary" onclick="nextQuestion()" ${currentQuestionIndex === shuffledQuestions.length - 1 ? 'style="flex: 1;"' : ''}>
                            ${currentQuestionIndex === shuffledQuestions.length - 1 ? 'Submit Exam ✓' : 'Next →'}
                        </button>`
                    }
                </div>
            `;
            
            document.getElementById('examContent').innerHTML = html;
            updateProgress();
        }

        function selectAnswer(idx) {
            const q = shuffledQuestions[currentQuestionIndex];
            answers[currentQuestionIndex] = idx;
            if (idx === q.correct) {
                correct++;
                subjectScores[q.subject]++;
            }
            subjectCounts[q.subject]++;
            updateSubjectDisplay();
            renderQuestion();
        }

        function updateSubjectDisplay() {
            document.getElementById('chemScore').textContent = `${subjectScores['Chemistry']}/30`;
            document.getElementById('mathScore').textContent = `${subjectScores['Mathematics']}/30`;
            document.getElementById('physScore').textContent = `${subjectScores['Physics']}/30`;
            document.getElementById('bioScore').textContent = `${subjectScores['Biology']}/30`;
            document.getElementById('engScore').textContent = `${subjectScores['English']}/30`;
        }

        function nextQuestion() {
            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                showResults();
            } else {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('correctCount').textContent = correct;
            const percentage = Math.round((correct / (currentQuestionIndex + 1)) * 100);
            document.getElementById('scorePercentage').textContent = percentage + '%';
        }

        function showResults() {
            const percentage = Math.round((correct / shuffledQuestions.length) * 100);
            let message = '';
            if (percentage >= 80) message = '🎉 Excellent! Outstanding performance!';
            else if (percentage >= 70) message = '👍 Great job! Very good understanding!';
            else if (percentage >= 60) message = '📚 Good effort! Keep practicing!';
            else if (percentage >= 50) message = '💪 Fair attempt! Review the material!';
            else message = '⚠️ Needs improvement. Study more!';

            document.getElementById('finalScore').textContent = `${correct}/150`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('breakdownCorrect').textContent = correct;
            document.getElementById('breakdownWrong').textContent = 150 - correct;

            const subjectResultsHTML = `
                <div class="subject-result-item">
                    <div class="subject-name">Chemistry</div>
                    <div class="score">${subjectScores['Chemistry']}/30</div>
                </div>
                <div class="subject-result-item">
                    <div class="subject-name">Mathematics</div>
                    <div class="score">${subjectScores['Mathematics']}/30</div>
                </div>
                <div class="subject-result-item">
                    <div class="subject-name">Physics</div>
                    <div class="score">${subjectScores['Physics']}/30</div>
                </div>
                <div class="subject-result-item">
                    <div class="subject-name">Biology</div>
                    <div class="score">${subjectScores['Biology']}/30</div>
                </div>
                <div class="subject-result-item">
                    <div class="subject-name">English</div>
                    <div class="score">${subjectScores['English']}/30</div>
                </div>
            `;
            document.getElementById('subjectResultsList').innerHTML = subjectResultsHTML;
            
            document.getElementById('examContent').style.display = 'none';
            document.getElementById('resultsScreen').classList.add('show');
        }

        function restartExam() {
            currentQuestionIndex = 0;
            answers = {};
            correct = 0;
            subjectScores = { Chemistry: 0, Mathematics: 0, Physics: 0, Biology: 0, English: 0 };
            subjectCounts = { Chemistry: 0, Mathematics: 0, Physics: 0, Biology: 0, English: 0 };
            document.getElementById('examContent').style.display = 'block';
            document.getElementById('resultsScreen').classList.remove('show');
            shuffledQuestions = shuffleArray(allQuestions);
            renderSubjectStats();
            renderQuestion();
        }

        function viewAnswerKey() {
            let html = '';
            allQuestions.forEach(q => {
                const correctLetter = String.fromCharCode(65 + q.correct);
                html += `
                    <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #eee; font-size: 13px;">
                        <strong>Q${q.num} (${q.subject}):</strong> ${q.text}<br>
                        <span style="color: #4caf50; font-weight: 600;">✓ Answer: ${correctLetter}</span>
                    </div>
                `;
            });
            document.getElementById('answerKeyContent').innerHTML = html;
            document.getElementById('answerKeyModal').classList.add('show');
        }

        function closeAnswerKey() {
            document.getElementById('answerKeyModal').classList.remove('show');
        }

        window.onload = initExam;
    </script>
</body>
</html>
