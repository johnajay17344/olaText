<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn With Jay - JSS3 Exam Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-box .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .question-container {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .question-category {
            background: #e8eaf6;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option:hover:not(.answered) {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option-letter {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .option.answered {
            cursor: not-allowed;
        }

        .option.correct {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .option.correct .option-letter {
            background: #4caf50;
        }

        .option.wrong {
            border-color: #f44336;
            background: #fef3f2;
        }

        .option.wrong .option-letter {
            background: #f44336;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .feedback.wrong {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            flex: 1;
            min-width: 120px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .results-screen {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .results-screen.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .results-score {
            font-size: 60px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .results-percentage {
            font-size: 28px;
            color: #666;
            margin-bottom: 20px;
        }

        .results-message {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .results-breakdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
            text-align: center;
        }

        .breakdown-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .breakdown-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .breakdown-label {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }

            .question-text {
                font-size: 14px;
            }

            .results-score {
                font-size: 48px;
            }

            .results-percentage {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Learn With Jay</h1>
            <p>JSS3 General Examination | Objective Questions</p>
        </div>

        <div class="content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="number" id="currentQuestion">1</div>
                    <div class="label">Current Question</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Correct Answers</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="scorePercentage">0%</div>
                    <div class="label">Score</div>
                </div>
            </div>

            <div id="examContent">
                <!-- Questions will be inserted here -->
            </div>

            <div id="resultsScreen" class="results-screen">
                <div class="results-score" id="finalScore"></div>
                <div class="results-percentage" id="finalPercentage"></div>
                <div class="results-message" id="resultMessage"></div>
                <div class="results-breakdown">
                    <div class="breakdown-item">
                        <div class="breakdown-number" id="breakdownCorrect"></div>
                        <div class="breakdown-label">Correct</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-number" id="breakdownWrong"></div>
                        <div class="breakdown-label">Wrong</div>
                    </div>
                </div>
                <div class="buttons">
                    <button class="btn-primary" onclick="restartExam()">🔄 Try Again</button>
                    <button class="btn-secondary" onclick="viewAnswerKey()">📋 View Answer Key</button>
                </div>
            </div>
        </div>
    </div>

    <div id="answerKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Answer Key - All 40 Questions</div>
            <div id="answerKeyContent"></div>
            <button class="btn-primary" onclick="closeAnswerKey()" style="width: 100%; margin-top: 20px;">Close</button>
        </div>
    </div>

    <script>
        const questions = [
            { num: 1, text: "Which of the following is NOT a pure substance?", options: ["Diamond", "Sea water", "Copper", "Oxygen gas"], correct: 1, category: "Basic Science", explanation: "Sea water is a mixture of salt, water, and other substances. The others are pure substances." },
            { num: 2, text: "The process by which a liquid changes to a gas is called?", options: ["Evaporation", "Condensation", "Sublimation", "Freezing"], correct: 0, category: "Basic Science", explanation: "Evaporation is when a liquid turns into a gas. Condensation is the opposite process." },
            { num: 3, text: "In a food chain, the organisms that produce their own food are called?", options: ["Consumers", "Producers", "Decomposers", "Parasites"], correct: 1, category: "Basic Science", explanation: "Producers like plants make their own food through photosynthesis." },
            { num: 4, text: "The speed of light is approximately?", options: ["300,000 km/s", "150,000 km/s", "450,000 km/s", "100,000 km/s"], correct: 0, category: "Basic Science", explanation: "Light travels at about 300,000 kilometers per second in a vacuum." },
            { num: 5, text: "Which blood group is considered the universal donor?", options: ["AB", "A", "O", "B"], correct: 2, category: "Basic Science", explanation: "O negative blood type is the universal donor because it lacks A and B antigens." },
            { num: 6, text: "The process of reproduction without fertilization is called?", options: ["Sexual reproduction", "Asexual reproduction", "Budding and fission only", "Conjugation"], correct: 1, category: "Basic Science", explanation: "Asexual reproduction involves one organism producing offspring without a partner." },
            { num: 7, text: "Photosynthesis primarily occurs in which organelle?", options: ["Mitochondrion", "Chloroplast", "Ribosome", "Nucleus"], correct: 1, category: "Basic Science", explanation: "Chloroplasts contain chlorophyll and are where photosynthesis happens in plant cells." },
            { num: 8, text: "The pH of a neutral solution is?", options: ["7", "0", "14", "1"], correct: 0, category: "Basic Science", explanation: "pH 7 indicates a neutral solution. Below 7 is acidic, above 7 is basic." },
            { num: 9, text: "Which gas do plants absorb during photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], correct: 2, category: "Basic Science", explanation: "Plants absorb CO₂ from the air and use it with water and sunlight to make glucose." },
            { num: 10, text: "The process of converting dead organic matter into inorganic substances is?", options: ["Photosynthesis", "Decomposition", "Fermentation", "Respiration"], correct: 1, category: "Basic Science", explanation: "Decomposition is done by organisms like bacteria and fungi breaking down dead matter." },
            { num: 11, text: "If 3x + 5 = 20, what is the value of x?", options: ["5", "10", "15", "3"], correct: 0, category: "Mathematics", explanation: "3x + 5 = 20 → 3x = 15 → x = 5" },
            { num: 12, text: "What is the area of a rectangle with length 8cm and width 5cm?", options: ["13 cm²", "26 cm²", "40 cm²", "80 cm²"], correct: 2, category: "Mathematics", explanation: "Area = length × width = 8 × 5 = 40 cm²" },
            { num: 13, text: "Solve: 2(x - 3) = 10", options: ["x = 8", "x = 5", "x = 13", "x = 2"], correct: 0, category: "Mathematics", explanation: "2(x - 3) = 10 → x - 3 = 5 → x = 8" },
            { num: 14, text: "What is 35% of 200?", options: ["70", "35", "140", "65"], correct: 0, category: "Mathematics", explanation: "35% of 200 = 0.35 × 200 = 70" },
            { num: 15, text: "The angle sum of a quadrilateral is?", options: ["180°", "270°", "360°", "540°"], correct: 2, category: "Mathematics", explanation: "All interior angles of any quadrilateral sum to 360 degrees." },
            { num: 16, text: "If the volume of a cube is 64 cm³, what is its side length?", options: ["4 cm", "8 cm", "2 cm", "16 cm"], correct: 0, category: "Mathematics", explanation: "Volume of cube = side³. If side³ = 64, then side = 4 cm (since 4³ = 64)" },
            { num: 17, text: "What is the value of 2⁵?", options: ["10", "25", "32", "16"], correct: 2, category: "Mathematics", explanation: "2⁵ = 2 × 2 × 2 × 2 × 2 = 32" },
            { num: 18, text: "Simplify: (12x² + 8x) ÷ 4x", options: ["3x + 2", "3x² + 2x", "12x + 8", "3x + 8"], correct: 0, category: "Mathematics", explanation: "(12x² + 8x) ÷ 4x = 12x²/4x + 8x/4x = 3x + 2" },
            { num: 19, text: "What is the probability of getting a head when tossing a fair coin?", options: ["0.25", "0.5", "0.75", "1"], correct: 1, category: "Mathematics", explanation: "A fair coin has two equal outcomes, so P(Head) = 1/2 = 0.5" },
            { num: 20, text: "If a : b = 3 : 4 and a = 9, what is b?", options: ["12", "6", "27", "3"], correct: 0, category: "Mathematics", explanation: "If a : b = 3 : 4 and a = 9, then 9 : b = 3 : 4. Therefore b = 9 × 4/3 = 12" },
            { num: 21, text: "Which of the following is a hardware component?", options: ["Microsoft Word", "RAM", "Java", "Python"], correct: 1, category: "Basic Technology", explanation: "RAM (Random Access Memory) is physical hardware. The others are software." },
            { num: 22, text: "The brain of the computer is the?", options: ["RAM", "ROM", "CPU", "Hard Drive"], correct: 2, category: "Basic Technology", explanation: "The CPU (Central Processing Unit) controls all operations and is the brain of the computer." },
            { num: 23, text: "Which device is used to input data into a computer?", options: ["Monitor", "Speaker", "Keyboard", "Printer"], correct: 2, category: "Basic Technology", explanation: "A keyboard is an input device. Monitor, speaker, and printer are output devices." },
            { num: 24, text: "What does HTML stand for?", options: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlinks and Text Markup Language"], correct: 0, category: "Basic Technology", explanation: "HTML stands for HyperText Markup Language and is used to create web pages." },
            { num: 25, text: "Which is the correct order of computer hardware from smallest to largest?", options: ["CPU, Motherboard, Computer", "Motherboard, CPU, Computer", "Computer, Motherboard, CPU", "CPU, Computer, Motherboard"], correct: 0, category: "Basic Technology", explanation: "CPU is smallest, motherboard contains it, and computer case contains the motherboard." },
            { num: 26, text: "A virus that replicates by copying itself to other programs is called?", options: ["Worm", "Trojan", "Logic bomb", "Antivirus"], correct: 0, category: "Basic Technology", explanation: "A worm replicates itself. Trojans disguise themselves; logic bombs are malicious code." },
            { num: 27, text: "The process of finding and fixing errors in a program is called?", options: ["Compilation", "Debugging", "Execution", "Linking"], correct: 1, category: "Basic Technology", explanation: "Debugging is the process of identifying and removing errors (bugs) from code." },
            { num: 28, text: "Which is NOT a type of software?", options: ["System software", "Application software", "Firmware", "Monitor"], correct: 3, category: "Basic Technology", explanation: "Monitor is hardware. System software, application software, and firmware are all types of software." },
            { num: 29, text: "The smallest unit of data in a computer is?", options: ["Byte", "Bit", "Kilobyte", "Megabyte"], correct: 1, category: "Basic Technology", explanation: "A bit is 0 or 1. A byte is 8 bits. Larger units are kilobyte, megabyte, etc." },
            { num: 30, text: "A network of interconnected computers worldwide is called?", options: ["LAN", "WAN", "Internet", "Intranet"], correct: 2, category: "Basic Technology", explanation: "The Internet is the global network connecting millions of computers worldwide." },
            { num: 31, text: "Which operating system is an open-source software?", options: ["Windows", "macOS", "Linux", "iOS"], correct: 2, category: "Basic Technology", explanation: "Linux is free, open-source OS. Windows and macOS are proprietary; iOS is mobile OS." },
            { num: 32, text: "The device used to connect a computer to the internet is?", options: ["Modem", "RAM", "CPU", "Cache"], correct: 0, category: "Basic Technology", explanation: "A modem connects your computer to the internet service provider." },
            { num: 33, text: "Which of the following is a search engine?", options: ["Firefox", "Google", "Windows", "Adobe"], correct: 1, category: "Basic Technology", explanation: "Google is a search engine. Firefox is a browser; Windows and Adobe are other software." },
            { num: 34, text: "A program that protects a computer from unauthorized access is?", options: ["Firewall", "Modem", "Router", "Gateway"], correct: 0, category: "Basic Technology", explanation: "A firewall monitors and controls incoming/outgoing network traffic." },
            { num: 35, text: "The temporary storage of data in a computer is?", options: ["Hard Drive", "RAM", "ROM", "Cache"], correct: 1, category: "Basic Technology", explanation: "RAM is volatile memory that stores data temporarily while computer is on." },
            { num: 36, text: "Which file format is used for images?", options: ["DOCX", "JPEG", "XLSX", "TXT"], correct: 1, category: "Basic Technology", explanation: "JPEG is an image format. DOCX is Word, XLSX is Excel, TXT is text." },
            { num: 37, text: "The process of converting analog signals to digital signals is called?", options: ["Digitization", "Encoding", "Decoding", "Compression"], correct: 0, category: "Basic Technology", explanation: "Digitization converts continuous analog signals into discrete digital data." },
            { num: 38, text: "Which key combination is used to save a document in most applications?", options: ["Ctrl + S", "Ctrl + A", "Ctrl + C", "Ctrl + Z"], correct: 0, category: "Basic Technology", explanation: "Ctrl + S is the standard save shortcut in most applications globally." },
            { num: 39, text: "A device that stores data for a long period is?", options: ["Cache", "RAM", "Hard Drive", "Register"], correct: 2, category: "Basic Technology", explanation: "Hard drives provide permanent storage. RAM is temporary; cache and registers are very small." },
            { num: 40, text: "The graphical interface used by computers is called?", options: ["Command line", "GUI", "API", "SDK"], correct: 1, category: "Basic Technology", explanation: "GUI (Graphical User Interface) uses windows, icons, and mouse. Command line is text-based." }
        ];

        let currentQuestionIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let correct = 0;
        let examStarted = false;

        function initExam() {
            renderQuestion();
            examStarted = true;
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const html = `
                <div class="question-container">
                    <div class="question-header">
                        <div class="question-number">Question ${q.num} of 40</div>
                        <div class="question-category">${q.category}</div>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        ${q.options.map((opt, idx) => {
                            const letter = String.fromCharCode(65 + idx);
                            const isAnswered = answers[currentQuestionIndex] !== null;
                            const isCorrect = isAnswered && idx === q.correct;
                            const isWrong = isAnswered && idx === answers[currentQuestionIndex] && idx !== q.correct;
                            const classes = ['option'];
                            if (isAnswered) classes.push('answered');
                            if (isCorrect) classes.push('correct');
                            if (isWrong) classes.push('wrong');
                            
                            return `
                                <div class="${classes.join(' ')}" onclick="selectAnswer(${idx})" ${isAnswered ? 'style="pointer-events: none;"' : ''}>
                                    <div class="option-letter">${letter}</div>
                                    <div>${opt}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${answers[currentQuestionIndex] !== null ? `
                        <div class="feedback show ${answers[currentQuestionIndex] === q.correct ? 'correct' : 'wrong'}">
                            <div class="feedback-title">${answers[currentQuestionIndex] === q.correct ? '✅ Correct!' : '❌ Incorrect'}</div>
                            <div>${q.explanation}</div>
                        </div>
                    ` : ''}
                </div>
                <div class="buttons">
                    <button class="btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>← Previous</button>
                    ${answers[currentQuestionIndex] === null ? 
                        `<button class="btn-secondary" disabled>Select an answer</button>` :
                        `<button class="btn-primary" onclick="nextQuestion()" ${currentQuestionIndex === questions.length - 1 ? 'style="flex: 1;"' : ''}>
                            ${currentQuestionIndex === questions.length - 1 ? 'Submit Exam ✓' : 'Next →'}
                        </button>`
                    }
                </div>
            `;
            
            document.getElementById('examContent').innerHTML = html;
            updateProgress();
        }

        function selectAnswer(idx) {
            answers[currentQuestionIndex] = idx;
            if (idx === questions[currentQuestionIndex].correct) {
                correct++;
            }
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex === questions.length - 1) {
                showResults();
            } else {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('correctCount').textContent = correct;
            const percentage = Math.round((correct / (currentQuestionIndex + 1)) * 100);
            document.getElementById('scorePercentage').textContent = percentage + '%';
        }

        function showResults() {
            const percentage = Math.round((correct / questions.length) * 100);
            let message = '';
            if (percentage >= 80) message = '🎉 Excellent! Outstanding performance!';
            else if (percentage >= 70) message = '👍 Great job! Very good understanding!';
            else if (percentage >= 60) message = '📚 Good effort! Keep practicing!';
            else if (percentage >= 50) message = '💪 Fair attempt! Review the material!';
            else message = '⚠️ Needs improvement. Study more!';

            document.getElementById('finalScore').textContent = `${correct}/40`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('breakdownCorrect').textContent = correct;
            document.getElementById('breakdownWrong').textContent = 40 - correct;
            
            document.getElementById('examContent').style.display = 'none';
            document.getElementById('resultsScreen').classList.add('show');
        }

        function restartExam() {
            currentQuestionIndex = 0;
            answers = new Array(questions.length).fill(null);
            correct = 0;
            document.getElementById('examContent').style.display = 'block';
            document.getElementById('resultsScreen').classList.remove('show');
            renderQuestion();
        }

        function viewAnswerKey() {
            let html = '';
            questions.forEach(q => {
                const correctLetter = String.fromCharCode(65 + q.correct);
                html += `
                    <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
                        <strong>Q${q.num}: ${q.text}</strong><br>
                        <span style="color: #4caf50; font-weight: 600;">Correct Answer: ${correctLetter}</span>
                    </div>
                `;
            });
            document.getElementById('answerKeyContent').innerHTML = html;
            document.getElementById('answerKeyModal').classList.add('show');
        }

        function closeAnswerKey() {
            document.getElementById('answerKeyModal').classList.remove('show');
        }

        // Start exam on load
        window.onload = initExam;
    </script>
</body>
